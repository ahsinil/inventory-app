version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventory-app:vps
    container_name: inventory_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - APP_NAME=${APP_NAME:-Stockroom}
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - LOG_CHANNEL=stderr
      - LOG_STDERR_FORMATTER=Monolog\Formatter\JsonFormatter

      # Database terhubung ke container MySQL Anda di network internal
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-inventory}
      - DB_USERNAME=${DB_USERNAME:-inventory}
      - DB_PASSWORD=${DB_PASSWORD:-secret}

      # Driver antrean dan cache menggunakan database bawaan
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=database
    volumes:
      # Penyimpanan file upload agar tidak hilang saat container diperbarui
      - inventory_storage:/var/www/html/storage/app
    networks:
      - internal

networks:
  internal:
    external: true

volumes:
  inventory_storage:
    driver: local
